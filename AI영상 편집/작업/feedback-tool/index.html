<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 피드백</title>
<style>
:root{
  --bg:#0d0f14; --panel:#14171e; --card:#1a1e27; --line:#262b37; --line2:#313848;
  --text:#e9ebf0; --sub:#9aa1b2; --dim:#697085;
  --accent:#ff7a1a; --accent-soft:rgba(255,122,26,.16);
  --ok:#3ecf8e; --warn:#f5b53d; --danger:#ff5d5d;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100vh}
.main{display:flex;flex-direction:column;min-width:0;padding:14px 18px 10px;gap:10px;overflow-y:auto}
.top{display:flex;align-items:center;gap:12px}
.title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .proj{color:var(--sub);font-weight:500}
.title .sep{color:var(--dim);margin:0 6px}
select{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;max-width:380px}
select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.topbtn{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--sub);white-space:nowrap}
.topbtn:hover{color:var(--text);border-color:#4a5368}
.topbtn.share{color:#9fd3ff}
.item .who{font-size:12px;color:#9fd3ff;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--panel,#161a22);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;width:min(560px,92vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h3{margin:0;font-size:16px}
.mbox p,.mbox li{margin:0;color:var(--sub);font-size:13px;line-height:1.6}
.mbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mbox label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.mbox input,.mbox select{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;color:var(--text);font:inherit;max-width:none}
.mbox .linkbox{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all}
.mbox .mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mbox .msg{font-size:13px;min-height:18px}
.mbox .msg.err{color:#ffb3b3}.mbox .msg.ok{color:#7be0b0}
.banner{border:1px solid #5b4420;background:#2a2112;color:#f5d28a;border-radius:8px;padding:8px 12px;font-size:13px}
.banner.err{border-color:#6b2a2a;background:#2a1414;color:#ffb3b3}
/* 영상 + 그리기 */
.stage{flex:1 1 auto;min-height:220px;background:#000;border-radius:10px;overflow:hidden;position:relative}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
canvas.draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage.drawing canvas.draw{pointer-events:auto;cursor:crosshair}
.stage.drawing{box-shadow:inset 0 0 0 2px var(--accent)}
.drawbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(20,23,30,.94);border:1px solid var(--line2);border-radius:10px;padding:4px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.drawbar .lbl{font-size:12px;color:var(--accent);font-weight:700;padding:0 8px}
.drawbar button{background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 10px;font-size:13px;color:var(--sub)}
.drawbar button:hover{color:var(--text);background:#232836}
.drawbar button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.drawbar button.done{background:var(--accent);color:#1b0f04;font-weight:700}
.drawbar .sp{width:1px;height:20px;background:var(--line2);margin:0 2px}
/* 클립 스트립 */
.strip{position:relative;height:32px;background:#12151c;border:1px solid var(--line);border-radius:8px;cursor:pointer;flex:none;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-left:1px solid rgba(0,0,0,.55)}
.seg.main{background:#2b3a55}
.seg.main.alt{background:#34476a}
.seg.broll{background:#5a4a33}
.seg.gap{background:repeating-linear-gradient(45deg,#171a22,#171a22 4px,#1c2029 4px,#1c2029 8px)}
.rng{position:absolute;bottom:0;height:6px;background:var(--tc);opacity:.85;z-index:2;border-radius:2px}
.rng.done{opacity:.3}
.draftrng{position:absolute;top:0;bottom:0;background:rgba(255,122,26,.22);border-left:2px solid var(--accent);border-right:2px solid var(--accent);z-index:2;pointer-events:none}
.mk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--tc);box-shadow:0 0 6px var(--tc);cursor:pointer;z-index:3}
.mk.done{opacity:.35;box-shadow:none}
.mk.skipped{box-shadow:0 0 0 1px var(--warn)}
.mk::before{content:"";position:absolute;left:-3px;top:-1px;width:9px;height:9px;border-radius:50%;background:inherit}
.playhead{position:absolute;top:-1px;bottom:-1px;width:2px;background:#fff;z-index:4;pointer-events:none;box-shadow:0 0 4px rgba(255,255,255,.6)}
/* 현재 위치 줄 */
.posrow{display:flex;align-items:center;gap:10px;flex:none}
.posrow .info{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.posrow .tm{font-family:var(--mono);font-weight:600}
.posrow .sub{color:var(--sub)}
.pill{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:4px;vertical-align:1px;font-weight:600}
.btn{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:#4a5368}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b0f04;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub);padding:2px 8px;font-size:12px}
.btn.ghost:hover{color:var(--text);border-color:var(--line2)}
.btn.small{padding:3px 10px;font-size:12.5px;border-radius:999px;color:var(--sub)}
.btn.small:hover{color:var(--text)}
.btn.small.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
/* 입력 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex:none}
.cardhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;min-height:24px}
.cardhead .dh{font-family:var(--mono);font-weight:700;color:var(--sub)}
.cardhead.frozen .dh{color:var(--accent)}
.cardhead .df{color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardhead .grow{flex:1}
#badges{display:flex;gap:6px}
.badge{font-size:11.5px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 8px;white-space:nowrap}
.badge button{background:none;border:0;color:inherit;padding:0 0 0 4px;font-size:11px}
.row2{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--text)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.chip:hover{border-color:#566079}
.chip.on{background:color-mix(in srgb,var(--tc) 18%,transparent);border-color:var(--tc);color:var(--tc);font-weight:600}
.tools{display:flex;gap:6px}
.inputwrap{position:relative;display:flex;gap:10px;align-items:stretch}
textarea{flex:1;min-width:0;resize:none;background:#0f1218;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;line-height:1.5}
textarea::placeholder{color:var(--dim)}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inputwrap .btn.primary{align-self:flex-end;padding:8px 18px}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.ac{position:absolute;left:0;bottom:calc(100% + 4px);width:min(520px,calc(100% - 100px));background:#202533;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;z-index:20}
.ac div{padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac div.on{background:var(--accent-soft);color:var(--accent)}
.keys{flex:none;font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 14px;padding:2px 2px 0}
kbd{font-family:var(--mono);font-size:11px;background:#1b1f29;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--sub);margin-right:3px}
/* 오른쪽 패널 */
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100vh}
.panel-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.panel-head .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel-head h2{margin:0;font-size:15px}
.count{font-size:13px;color:var(--sub)}
.count b{color:var(--accent)}
.search{width:100%;background:#0f1218;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px}
.search:focus{outline:none;border-color:var(--accent)}
.segctl{display:flex;background:#0f1218;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.segctl button{flex:1;background:none;border:0;border-radius:6px;padding:3px 0;font-size:12px;color:var(--sub)}
.segctl button.on{background:#262c3a;color:var(--text);font-weight:600}
.tfilter{display:flex;flex-wrap:wrap;gap:4px}
.tfilter button{background:none;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--sub)}
.tfilter button i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tc);margin-right:4px;vertical-align:1px}
.tfilter button.on{border-color:var(--tc);color:var(--tc)}
.claude{display:flex;flex-direction:column;gap:4px}
.claude .btn.primary{width:100%;padding:8px 10px;font-size:13.5px}
.claude .btn.primary:disabled{opacity:.55;cursor:default}
.claude-opts{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
.claude-opts label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.claude-opts .grow{flex:1}
/* Claude Code 작업 카드 */
.job{margin:8px 12px 0;border:1px solid var(--line2);border-radius:12px;background:#151b26;padding:10px 12px;font-size:12.5px;position:relative}
.job.running{border-color:#3b5b8a;box-shadow:0 0 0 1px rgba(77,141,255,.15)}
.job.done{border-color:#2c6b4d}
.job.failed,.job.interrupted{border-color:#7a3434}
.job .jh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.job .jh b{font-size:13px}
.job .jh .tm{font-family:var(--mono);color:var(--sub);font-size:12px}
.job .jh .grow{flex:1}
.job .spin{width:12px;height:12px;border:2px solid #4d8dff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.job .log{font-family:var(--mono);font-size:11.5px;color:#b9c3d6;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;background:#0f141d;border-radius:8px;padding:6px 8px}
.job .log.full{max-height:340px}
.job .log .text{color:#e9ebf0}
.job .log .warn{color:#f5b53d}
.job .log .end{color:#3ecf8e;font-weight:700}
.job .report{white-space:pre-wrap;word-break:break-word;background:#0f141d;border-radius:8px;padding:8px 10px;margin-top:6px;color:var(--text);font-size:12.5px;max-height:220px;overflow-y:auto}
.job .err{color:#ffb3b3;white-space:pre-wrap;word-break:break-word;margin-top:6px}
.job .jb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.job .jb .btn{font-size:12px;padding:4px 10px}
.notice{margin:8px 12px 0;background:#182230;border:1px solid #2c4a6b;border-radius:10px;padding:9px 30px 9px 11px;font-size:12.5px;color:#cfe3ff;position:relative;line-height:1.6}
.notice code{font-family:var(--mono);font-size:11.5px;color:#fff;word-break:break-all}
.notice .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--sub);font-size:14px}
.list{flex:1;overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:13px;line-height:1.7}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:10px;padding:9px 11px;cursor:pointer;position:relative}
.item:hover{border-color:#414a5f;border-left-color:var(--tc)}
.item.active{box-shadow:0 0 0 1.5px var(--accent)}
.item.done{opacity:.62}
.item.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:#3a2a17}to{background:var(--card)}}
.item .r1{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-bottom:3px}
.item .t{font-family:var(--mono);font-weight:700;color:var(--tc);font-size:13px;white-space:nowrap}
.item .ty{font-size:11px;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);border-radius:999px;padding:0 7px;white-space:nowrap}
.item .st{margin-left:auto;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap}
.st.pending{color:var(--sub);background:#232836}
.st.done{color:#0c2a1c;background:var(--ok)}
.st.skipped{color:#2d2108;background:var(--warn)}
.st.question{color:#1d1030;background:#c39bff}
.item.question .res{color:#d6bcff}
.savestate{margin-left:8px;font-size:12px}
.savestate.saved{color:var(--ok)}
.savestate.saving,.savestate.draft{color:var(--sub)}
.savestate.error{color:#ffb3b3;font-weight:600}
.posrow .tl{color:var(--dim);font-family:var(--mono);font-size:12px;margin-left:6px}
.item .body{display:flex;gap:10px;align-items:flex-start}
.item .note{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.item .thumb{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line2);flex:none;background:#000}
.item .src{margin-top:4px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .res{margin-top:5px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line2);padding-top:5px;white-space:pre-wrap;word-break:break-word}
.item.skipped .res{color:#e8c36f}
.item .acts{display:none;position:absolute;right:8px;bottom:6px;gap:2px;background:var(--card);border-radius:6px}
.item:hover .acts{display:flex}
.acts button{background:none;border:0;color:var(--dim);font-size:12px;padding:2px 6px;border-radius:6px}
.acts button:hover{color:var(--text);background:#262c3a}
.acts button.ok:hover{color:var(--ok)}
.acts button.del:hover{color:var(--danger)}
.edit textarea{width:100%;min-height:60px;margin:4px 0}
.edit .eb{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#262c3a;border:1px solid var(--line2);padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:13px;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--danger);color:#ffb3b3}
@media (max-width:980px){.app{grid-template-columns:1fr}.panel{height:auto;max-height:60vh}}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="top">
      <div class="title" id="title"><span class="proj">…</span></div>
      <select id="videoSel" title="영상 선택"></select>
      <button class="topbtn" id="addLinkBtn" title="구글 드라이브에 올린 영상을 링크로 불러오기">＋ 드라이브 영상</button>
      <button class="topbtn share" id="shareBtn" title="고객사가 이 영상을 보고 피드백을 남길 수 있는 링크">🌐 고객 링크</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div class="stage" id="stage">
      <video id="v" controls preload="auto" playsinline></video>
      <canvas class="draw" id="draw"></canvas>
      <div class="drawbar" id="drawBar" hidden>
        <span class="lbl">✏️ 그리기</span>
        <button data-tool="pen">펜</button>
        <button data-tool="arrow">화살표</button>
        <button data-tool="rect">네모</button>
        <span class="sp"></span>
        <button id="undoBtn" title="⌘Z">↶ 되돌리기</button>
        <button id="clearDrawBtn">모두 지우기</button>
        <span class="sp"></span>
        <button class="done" id="drawDoneBtn">완료 (D)</button>
      </div>
    </div>
    <div id="strip" class="strip" title="클릭하면 그 위치로 이동"></div>
    <div class="posrow">
      <button class="btn" id="prevBtn">◀ 이전 자료</button>
      <div class="info" id="posInfo"></div>
      <button class="btn" id="nextBtn">다음 자료 ▶</button>
    </div>
    <section class="card">
      <div class="cardhead" id="cardHead">
        <span class="dh" id="dh">00:00.0에 남김</span><span class="df" id="df"></span>
        <span id="badges"></span>
        <span class="grow"></span>
        <button class="btn ghost" id="refreshPos" hidden>↻ 지금 위치로</button>
        <button class="btn ghost" id="cancelDraft" hidden>✕ 취소</button>
      </div>
      <div class="row2">
        <div class="chips" id="chips"></div>
        <div class="tools">
          <button class="btn small" id="inBtn" title="I">⇤ 구간 시작 I</button>
          <button class="btn small" id="outBtn" title="O">구간 끝 O ⇥</button>
          <button class="btn small" id="drawBtn" title="D">✏️ 그리기 D</button>
        </div>
      </div>
      <div class="inputwrap">
        <textarea id="note" rows="2" placeholder="어떻게 고칠지 적어 주세요 (예: 다른 터치 영상으로 바꿔줘)"></textarea>
        <div class="ac" id="ac" hidden></div>
        <button class="btn primary" id="saveBtn">남기기</button>
      </div>
      <div class="hint"><b>Enter</b>로 남기기 · Shift+Enter 줄바꿈 · 소스 파일명을 치면 자동완성 · 남길 때 화면 캡처가 함께 저장돼요 <span id="saveState" class="savestate"></span></div>
    </section>
    <div class="keys">
      <span><kbd>Space</kbd>재생·멈춤</span>
      <span><kbd>←</kbd><kbd>→</kbd>1프레임 (<kbd>Shift</kbd> 1초)</span>
      <span><kbd>M</kbd>피드백 쓰기</span>
      <span><kbd>Enter</kbd>저장</span>
      <span><kbd>I</kbd><kbd>O</kbd>구간 시작·끝</span>
      <span><kbd>J</kbd><kbd>L</kbd>이전·다음 자료</span>
      <span><kbd>D</kbd>화면에 그리기</span>
      <span><kbd>Esc</kbd>입력·그리기 끝내기</span>
    </div>
  </main>
  <aside class="panel">
    <div class="panel-head">
      <div class="row"><h2>피드백</h2><div class="count" id="count"></div></div>

<script>
const $ = s => document.querySelector(s);
const h = (tag, props = {}, ...kids) => {

// 유형별 색 (리졸브 마커 색과 맞춤: 빨강·노랑·보라·파랑·청록·분홍)
const TYPE_COLORS = { '컷 삭제': '#ff5d5d', '길이 조절': '#f5c84b', '순서 변경': '#a77bff', '자막·텍스트 수정': '#4d8dff', '클립 교체': '#2ec5d3', '기타': '#ff7eb6' };
const TYPES = Object.keys(TYPE_COLORS);
const tcolor = ty => TYPE_COLORS[ty] || TYPE_COLORS['기타'];
const DRAW_COLOR = '#ff3b30';
const v = $('#v'), noteEl = $('#note'), stage = $('#stage'), cv = $('#draw'), cx = cv.getContext('2d');
const nfc = s => (s || '').normalize('NFC');

let state = { project: '', videos: [], sources: [], warnings: [] };
let cur = null, tl = null, items = [], lastSig = '';
let draft = null;          // { time, end, armed, shapes: [] } — 쓰기 시작한 순간 고정
let selType = null, editingId = null, activeId = null, saving = false;
let drawMode = false, tool = 'arrow', inProgress = null, viewShapes = null;
let filterStatus = 'all', filterTypes = new Set(), query = '';

/* ---------- 유틸 ---------- */
// 프레임 기준: 피드백 파일의 fps(FCPXML에서 읽음, 예: "30000/1001")
let rate = { num: 30, den: 1, fd: 1 / 30, base: 30, tc0: 0, hasTl: false };
function setRate(fpsStr, tcStart, hasTl) {

}
const frameAt = t => Math.max(0, Math.floor((t || 0) / rate.fd + 1e-4));   // 영상 시각 → 프레임 번호
const frameTime = n => (n + 0.5) * rate.fd;                                  // 프레임 가운데 시각 (그 프레임이 정확히 보이게)
function tcOf(n) {   // 프레임 번호 → HH:MM:SS:FF

  const f = n % b, s = Math.floor(n / b);

}

const stem = n => nfc(n).replace(/\.[^.]+$/, '');
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 3500 : 2000);
}
async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));

}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, val) { try { localStorage.setItem(k, val); } catch (e) {} }
};
const duration = () => (isFinite(v.duration) && v.duration > 0) ? v.duration : (tl ? tl.duration : 0);
const fps = () => rate.num / rate.den;
function segAt(t) {

  for (const s of segs) if (t >= s.start && t < s.end) return s;
  return segs.length && Math.abs(t - segs[segs.length - 1].end) < 0.001 ? segs[segs.length - 1] : null;
}
function subAt(t) {

}
const snapUrl = p => '/snap/' + p.replace(/^snapshots\//, '').split('/').map(encodeURIComponent).join('/');
const statusOf = it => (!it.status || it.status === 'pending') ? 'todo' : it.status;
const rangeText = it => (it.start_tc || tcOf(it.start_frame || 0)) + (it.end_tc ? ' ~ ' + it.end_tc : '');
const tStart = it => it.start_seconds != null ? it.start_seconds : (it.time || 0);
const tEnd = it => it.end_seconds != null ? it.end_seconds : (it.time_end != null ? it.time_end : null);

/* ---------- 영상 불러오기 ---------- */
async function loadState(first) {
  const s = await api('/api/state');
  const known = new Set(state.videos.map(x => x.name));
  const sigOf = vs => JSON.stringify(vs.map(x => [x.name, x.pending, x.total, x.timeline]));
  const changed = sigOf(s.videos) !== sigOf(state.videos);
  if (!first) s.videos.filter(x => !known.has(x.name)).forEach(x => toast('새 영상이 들어왔어요: ' + x.name));
  state = s;
  if (first || changed) renderSelect();
  return s;
}
function renderSelect() {
  const sel = $('#videoSel');
  sel.replaceChildren(...state.videos.map(x => h('option', { value: x.name, text: (x.url ? '☁ ' + stem(x.name) : x.name) + (x.pending ? `  (대기 ${x.pending})` : '') })));

  sel.style.display = state.videos.length > 1 ? '' : 'none';
}
async function loadVideo(name) {
  if (drawMode) exitDraw();

  store.set('lastVideo', name);
  $('#videoSel').value = name;
  $('#noticeBox').replaceChildren();
  $('#title').replaceChildren(h('span', { class: 'proj', text: state.project }), h('span', { class: 'sep', text: '·' }), h('span', { text: stem(name) }));
  document.title = stem(name) + ' · 영상 피드백';
  const pos = parseFloat(store.get('pos:' + name));   // 마지막으로 보던 자리 (src를 바꾸기 전에 읽어 둠)
  v.addEventListener('loadedmetadata', () => { if (pos > 0) v.currentTime = Math.min(pos, v.duration || pos); }, { once: true });

  if (meta.url) { v.crossOrigin = 'anonymous'; v.src = meta.url; }   // 구글 드라이브 영상 (화면 캡처를 위해 CORS로 먼저 시도)
  else { v.removeAttribute('crossorigin'); v.src = '/media/' + encodeURIComponent(name); }

  const [t, f] = await Promise.all([
    api('/api/timeline?video=' + encodeURIComponent(name)).catch(e => ({ error: e.message })),
    api('/api/feedback?video=' + encodeURIComponent(name)).catch(() => ({ items: [] }))
  ]);
  tl = t.data || null;
  setRate(f.fps, f.timeline_tc_start, !!f.fcpxml);
  showBanner(t);
  items = f.items || []; lastSig = JSON.stringify(items);
  noteEl.value = store.get('draftMemo:' + name) || '';   // 저장 전에 쓰던 메모가 있으면 되살림
  setSaveState(noteEl.value ? 'draft' : 'idle');

}
function showBanner(t) {
  const b = $('#banner'); b.hidden = true; b.classList.remove('err');
  if (t.error) { b.textContent = '타임라인(FCPXML)을 읽지 못했어요 — ' + t.error + ' (시간 메모는 그대로 쓸 수 있어요)'; b.classList.add('err'); b.hidden = false; }
  else if (!t.timeline && t.production) { /* Claude Code가 코드로 렌더한 영상: 타임라인이 없는 게 정상 */ }
  else if (!t.timeline) { b.textContent = '이 영상과 이름이 같은 타임라인(FCPXML)이 타임라인 폴더에 없어요. 시간 메모는 되지만 소스 파일명·자막은 기록되지 않아요.'; b.hidden = false; }
  else if (stem(t.timeline) !== stem(cur)) { b.textContent = '연결된 타임라인: ' + t.timeline + ' (영상과 이름이 달라요. 버전이 맞는지 확인해 주세요)'; b.hidden = false; }
}
let videoTries = 0;
v.addEventListener('error', () => {
  const meta = state.videos.find(x => x.name === cur) || {};
  if (meta.url && videoTries++ === 0) { v.removeAttribute('crossorigin'); v.src = meta.url; return; }   // CORS 없이 다시 (캡처만 빠짐)
  const b = $('#banner'); b.classList.add('err'); b.hidden = false;
  if (meta.url) {   // 서버가 알려 주는 이유를 함께 보여 줌
    b.textContent = '구글 드라이브 영상을 불러오지 못했어요.';
    fetch(meta.url, { headers: { Range: 'bytes=0-1' } }).then(r => r.ok ? null : r.json()).then(j => { if (j && j.error) b.textContent += ' ' + j.error; })
      .catch(() => { b.textContent += ' 인터넷 연결과 드라이브 공유 설정("링크가 있는 모든 사용자")을 확인해 주세요.'; });
    return;
  }
  b.textContent = '이 브라우저가 영상을 재생하지 못해요. ProRes 같은 코덱이면 Safari로 열어 보세요 (H.264 mp4로 렌더하면 어느 브라우저든 재생돼요).';
});

/* ---------- 클립 스트립 ---------- */
function renderStrip() {
  const strip = $('#strip'); const D = duration();
  strip.replaceChildren();
  if (!D) return;
  let alt = false;
  (tl ? tl.segments : []).forEach(s => {
    let cls = 'seg ';
    if (!s.file && !s.name) cls += 'gap'; else if (s.broll) cls += 'broll'; else { cls += 'main' + (alt ? ' alt' : ''); alt = !alt; }
    strip.append(h('div', { class: cls, style: `left:${s.start / D * 100}%;width:${(s.end - s.start) / D * 100}%`, title: `${fmt(s.start)} ~ ${fmt(s.end)}  ${s.file || s.name || '(빈 구간)'}${s.broll ? '  [B롤]' : ''}` }));
  });
  items.forEach(it => {
    const st = statusOf(it), c = `--tc:${tcolor(it.type)};`;
    if (tEnd(it) != null) strip.append(h('div', { class: 'rng ' + st, style: `${c}left:${tStart(it) / D * 100}%;width:${(tEnd(it) - tStart(it)) / D * 100}%` }));
    strip.append(h('div', { class: 'mk ' + st, style: `${c}left:${tStart(it) / D * 100}%`, title: `${rangeText(it)}  [${it.type}] ${it.memo || ''}`,
      onclick: e => { e.stopPropagation(); gotoItem(it); } }));
  });
  strip.append(h('div', { class: 'draftrng', id: 'draftRng', hidden: true }));
  strip.append(h('div', { class: 'playhead', id: 'playhead' }));

}
function renderDraftRange() {
  const el = $('#draftRng'); const D = duration(); if (!el || !D) return;
  let a = null, b = null;
  if (draft && draft.end != null) { a = draft.time; b = draft.end; }
  else if (draft && draft.armed) { a = draft.time; b = Math.max(draft.time, v.currentTime); }
  if (a == null) { el.hidden = true; return; }
  el.hidden = false; el.style.left = (a / D * 100) + '%'; el.style.width = Math.max(0.2, (b - a) / D * 100) + '%';
}
$('#strip').addEventListener('click', e => {

});
['loadedmetadata', 'durationchange'].forEach(ev => v.addEventListener(ev, renderStrip));

/* ---------- 재생 위치 ---------- */
let lastPosKey = '', lastOverlayKey = '';
function tick() {
  const t = v.currentTime || 0, D = duration();
  const ph = $('#playhead'); if (ph && D) ph.style.left = (t / D * 100) + '%';
  const seg = segAt(t), sub = subAt(t);
  const key = fmt(t) + '|' + (seg ? seg.file || seg.name : '') + '|' + sub;
  if (key !== lastPosKey) {
    lastPosKey = key;
    $('#posInfo').replaceChildren(h('span', {},
      h('span', { class: 'tm', text: fmt(t) }),
      rate.hasTl ? h('span', { class: 'tl', text: 'TL ' + tcOf(frameAt(t) + rate.tc0) }) : null,
      seg && (seg.file || seg.name) ? [' · 📁 ', h('span', { text: seg.file || seg.name }), seg.broll ? h('span', { class: 'pill', text: 'B롤' }) : null] : null,
      sub ? [' · ', h('span', { class: 'sub', text: '“' + sub + '”' })] : null));
    if (!draft) renderCardHead();
    if (draft && draft.armed && draft.end == null) renderDraftRange();
  }
  drawOverlay();
  const sec = Math.floor(t);

  requestAnimationFrame(tick);
}
function seek(t) {

}
function boundaries() { return (tl ? tl.segments : []).filter(s => s.file || s.name).map(s => s.start); }
function prevClip() { const t = v.currentTime, c = boundaries().filter(b => b < t - 0.3); seek(c.length ? Math.max(...c) : 0); }
function nextClip() { const t = v.currentTime, c = boundaries().filter(b => b > t + 0.02); seek(c.length ? Math.min(...c) : duration()); }
$('#prevBtn').onclick = prevClip; $('#nextBtn').onclick = nextClip;

/* ---------- 화면에 그리기 ---------- */
function contentRect() {
  const W = cv.clientWidth, H = cv.clientHeight, vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const s = Math.min(W / vw, H / vh), w = vw * s, hh = vh * s;
  return { x: (W - w) / 2, y: (H - hh) / 2, w, h: hh };
}
function paintShapes(ctx, shapes, r) {

    const P = s.points.map(([x, y]) => [r.x + x * r.w, r.y + y * r.h]);

      ctx.beginPath();

        const [a, b] = P, ang = Math.atan2(b[1] - a[1], b[0] - a[0]), hl = Math.max(12, r.h * 0.035);
        ctx.moveTo(...a); ctx.lineTo(...b);

}
function overlayShapes() {

  if (draft && draft.shapes.length && v.paused && near(draft.time)) return draft.shapes;
  if (viewShapes && v.paused && near(viewShapes.time)) return viewShapes.shapes;

}

});

};
cv.addEventListener('pointerup', finishShape);
cv.addEventListener('pointercancel', finishShape);
function renderTools() { document.querySelectorAll('#drawBar [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tool)); $('#drawBtn').classList.toggle('on', drawMode); }
document.querySelectorAll('#drawBar [data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; renderTools(); });
$('#undoBtn').onclick = () => { if (draft) { draft.shapes.pop(); renderCardHead(); } };
$('#clearDrawBtn').onclick = () => { if (draft) { draft.shapes = []; renderCardHead(); } };
$('#drawDoneBtn').onclick = () => exitDraw();
function enterDraw() {
  if (!cur) return;
  startDraft(true);
  if (Math.abs(v.currentTime - draft.time) > 0.02) seek(draft.time);

}
function exitDraw() {

  if (draft && !draft.shapes.length && draft.end == null && !draft.armed && !noteEl.value.trim() && document.activeElement !== noteEl) draft = null;
  stage.classList.remove('drawing'); $('#drawBar').hidden = true; renderTools(); renderCardHead();
}
$('#drawBtn').onmousedown = e => e.preventDefault();
$('#drawBtn').onclick = () => drawMode ? exitDraw() : enterDraw();

/* ---------- 구간 (I / O) ---------- */
function setIn() {
  if (!cur) return;
  const now = v.currentTime || 0;
  if (draft && draft.shapes.length && Math.abs(draft.time - now) > 0.05) toast('시작점이 바뀌어서 그림은 지웠어요');
  if (!draft || Math.abs(draft.time - now) > 0.05) draft = { time: now, end: null, armed: true, shapes: [] };
  else { draft.end = null; draft.armed = true; }
  renderCardHead(); renderDraftRange();

window.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') { e.preventDefault(); closeModal(); } return; }   // 창이 떠 있으면 단축키 끔
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select' || e.target.isContentEditable) return;  // 글 쓰는 중에는 단축키 끔
  const done = () => { e.preventDefault(); e.stopPropagation(); };
  if (drawMode) {  // 그리기 중에는 영상이 움직이지 않게
    if ((e.metaKey || e.ctrlKey) && e.code === 'KeyZ') { done(); $('#undoBtn').click(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Escape' || e.code === 'KeyD') { done(); exitDraw(); return; }
    if (e.code === 'KeyC' || e.code === 'KeyM') { done(); exitDraw(); noteEl.focus(); return; }
    if (['KeyK', 'KeyJ', 'KeyL', 'ArrowLeft', 'ArrowRight', 'KeyI', 'KeyO', 'Space', 'KeyM'].includes(e.code)) done();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const stepFrames = e.shiftKey ? rate.base : 1;   // ←/→ 1프레임, Shift 누르면 1초
  const stepBy = dir => { v.pause(); const n = frameAt(v.currentTime) + dir * stepFrames; seek(frameTime(Math.max(0, n))); };
  switch (e.code) {   // 한글 입력 상태에서도 동작하도록 e.code 사용
    case 'Space': case 'KeyK': done(); v.paused ? v.play().catch(() => {}) : v.pause(); break;
    case 'KeyJ': done(); prevClip(); break;
    case 'KeyL': done(); nextClip(); break;
    case 'ArrowLeft': done(); stepBy(-1); break;
    case 'ArrowRight': done(); stepBy(1); break;
    case 'KeyI': done(); setIn(); break;
    case 'KeyO': done(); setOut(); break;
    case 'KeyM': case 'KeyC': done(); startDraft(true); noteEl.focus(); break;
    case 'KeyD': done(); enterDraw(); break;
    case 'Escape': if (draft && !noteEl.value.trim()) { done(); $('#cancelDraft').click(); } break;
  }
}, true);
new ResizeObserver(() => drawOverlay(true)).observe(stage);

    $('#shareBtn').hidden = true;
    $('#title').textContent = '영상을 기다리는 중…';
    renderFilters();
  } else {
    const want = nfc(new URLSearchParams(location.search).get('video') || '');   // fb.py open 으로 연 영상
    const last = nfc(store.get('lastVideo') || '');
    const pick = (want && (state.videos.find(x => x.name === want) || state.videos.find(x => stem(x.name) === stem(want))))
      || state.videos.find(x => x.name === last) || [...state.videos].sort((a, b) => b.mtime - a.mtime)[0];

  pollJob();   // 페이지를 새로 열어도 진행 중인 Claude Code 작업을 이어서 보여줌

  setInterval(() => { if (!document.hidden) refreshFeedback(false).catch(() => {}); }, 2500);
  setInterval(() => { if (!document.hidden) loadState(false).then(() => { if (!cur && state.videos.length) loadVideo(state.videos[0].name); }).catch(() => {}); }, 5000);
})();
