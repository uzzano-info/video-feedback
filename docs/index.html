<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 피드백</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--card:#1b2029;--line:#2a3140;--line2:#353d4f;--text:#e8ecf3;--sub:#a3acbd;--dim:#788297;--accent:#ff8a3d;--ok:#3ccf8e;--warn:#f5c84b;--danger:#ff5d5d;--blue:#9fd3ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100vh}
.main{display:flex;flex-direction:column;min-width:0;padding:14px 18px 10px;gap:10px;overflow-y:auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .proj{color:var(--sub);font-weight:500}.title .sep{color:var(--dim);margin:0 6px}
.topbtn{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--sub);white-space:nowrap}
.topbtn:hover{color:var(--text);border-color:#4a5368}
.topbtn.blue{color:var(--blue)}.topbtn.hot{color:#1b0f04;background:var(--accent);border-color:var(--accent);font-weight:700}
.who{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}
.who input{width:120px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
.banner{border:1px solid #5b4420;background:#2a2112;color:#f5d28a;border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{border-color:#24527a;background:#13283a;color:#a9d4ff}
.banner.ok{border-color:#1f5b40;background:#11291e;color:#8be3b7}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-height:62vh;width:100%}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:20px}
canvas.draw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage.drawing canvas.draw{pointer-events:auto;cursor:crosshair}
.stage.drawing{box-shadow:inset 0 0 0 2px var(--accent)}
.drawbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(20,23,30,.94);border:1px solid var(--line2);border-radius:10px;padding:4px;z-index:5}
.drawbar button{background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 10px;font-size:13px;color:var(--sub)}
.drawbar button.on{color:var(--accent);border-color:var(--accent)}
.drawbar button:hover{color:var(--text)}
.timerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.timerow input{width:110px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-family:var(--mono)}
.timerow .hint{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.head{font-family:var(--mono);color:var(--sub);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:13px;background:var(--card)}
.chip.sel{border-color:var(--c);color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.tool{margin-left:auto;display:flex;gap:6px}
.btn{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:#4a5368}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b0f04;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:10px;align-items:stretch}
textarea{flex:1;min-height:64px;resize:vertical;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 11px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.state{font-size:12px;color:var(--dim)}
.state.saved{color:var(--ok)}.state.error{color:var(--danger)}
.keys{font-size:12px;color:var(--dim)}
.keys kbd{font-family:var(--mono);background:var(--card);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--sub)}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph b{font-size:15px}.cnt{color:var(--sub);font-size:13px}
.filters{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.filters button{flex:1;background:transparent;border:0;border-radius:7px;padding:5px 4px;font-size:12px;color:var(--sub)}
.filters button.on{background:#262c38;color:var(--text);font-weight:700}
.sendbox{display:flex;flex-direction:column;gap:6px}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;padding-right:2px}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:9px 11px;cursor:pointer}
.item:hover{border-color:#414a5f;border-left-color:var(--c)}
.item.active{box-shadow:0 0 0 1.5px var(--accent)}
.r1{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-bottom:3px}
.t{font-family:var(--mono);font-weight:700;color:var(--c);font-size:13px;white-space:nowrap}
.ty{font-size:11px;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;white-space:nowrap}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;white-space:nowrap;background:#1d3550;color:var(--blue)}
.memo{white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center}
.meta button{background:none;border:none;color:var(--dim);padding:0 2px;font-size:12px}
.meta button:hover{color:var(--text)}
.empty-list{color:var(--dim);text-align:center;padding:30px 10px;line-height:1.8;white-space:pre-line}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px 22px;width:min(600px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h3{margin:0;font-size:17px}
.mbox p{margin:0;color:var(--sub);font-size:13px;line-height:1.65}
.mbox label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:5px}
.mbox input,.mbox select,.mbox textarea{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;color:var(--text)}
.mbox .linkbox{font-family:var(--mono);font-size:12px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;word-break:break-all;max-height:120px;overflow:auto;user-select:all}
.mbox .mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;min-height:18px}.msg.err{color:#ffb3b3}.msg.ok{color:#7be0b0}
.recent{display:flex;flex-direction:column;gap:6px}
.recent a{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);text-decoration:none;font-size:13px}
.recent a span{color:var(--dim)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222836;border:1px solid var(--line2);border-radius:10px;padding:9px 16px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{border-color:var(--danger);color:#ffb3b3}
@media (max-width:980px){.app{grid-template-columns:1fr;height:auto}.panel{border-left:none;border-top:1px solid var(--line)}.list{max-height:none}.keys{display:none}}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="top">
      <div class="title" id="title"><span class="proj">영상 피드백</span></div>
      <label class="who">이름 <input id="author" maxlength="40" placeholder="예: 김대리"></label>
      <button class="topbtn" id="addBtn" title="구글 드라이브에 올린 영상을 링크로 불러오기">＋ 드라이브 영상</button>
      <button class="topbtn blue" id="shareBtn" title="고객에게 보낼 링크 복사">🔗 고객 링크</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="stage" id="stage">
      <div class="empty" id="stageEmpty">위의 ＋ 드라이브 영상으로 구글 드라이브 링크를 불러오세요.</div>
      <canvas class="draw" id="draw"></canvas>
      <div class="drawbar" id="drawBar" hidden>
        <button data-tool="pen" class="on">✏️ 펜</button><button data-tool="arrow">↗ 화살표</button><button data-tool="rect">▢ 네모</button>
        <button id="undoBtn">되돌리기</button><button id="clearBtn">지우기</button><button id="drawDone">완료</button>
      </div>
    </div>
    <div class="timerow">
      <label>시간 <input id="tStart" placeholder="예: 1:23"></label>
      <label>~ 끝 (선택) <input id="tEnd" placeholder="예: 1:30"></label>
      <span class="hint">플레이어 아래에 나오는 시간을 적어 주세요 (분:초 또는 00:01:23:15)</span>
    </div>
    <div class="card">
      <div class="head" id="head">시간을 적고 피드백을 남겨 주세요</div>
      <div class="chips" id="chips"><span class="tool"><button class="btn" id="drawBtn" title="영상 위에 그려서 위치 표시 (D)">✏️ 그리기 D</button></span></div>
      <div class="row">
        <textarea id="memo" placeholder="어떻게 고칠지 적어 주세요 (예: 여기 말 더듬는 부분 잘라 주세요)"></textarea>
        <button class="btn primary" id="saveBtn">남기기</button>
      </div>
      <div class="state" id="state">Enter로 남기기 · Shift+Enter 줄바꿈 · 남긴 피드백은 이 브라우저에 저장돼요</div>
    </div>
    <div class="keys"><kbd>T</kbd> 시간 칸 · <kbd>M</kbd> 피드백 쓰기 · <kbd>Enter</kbd> 남기기 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈 · <kbd>D</kbd> 화면에 그리기 · <kbd>Esc</kbd> 그리기 끝내기</div>
  </main>
  <aside class="panel">
    <div class="ph"><b>피드백</b><span class="cnt" id="cnt"></span></div>
    <div class="filters" id="filters"></div>
    <div class="sendbox">
      <button class="topbtn hot" id="sendBtn">📤 피드백 보내기</button>
      <button class="topbtn" id="recvBtn">📥 받은 피드백 링크 열기</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* 영상 피드백 (GitHub Pages) — 서버·로그인 없이 동작
   - 영상: 구글 드라이브 플레이어 (주소 ?v=<드라이브 ID>&n=<이름>&f=<프레임레이트>)
   - 피드백: 이 브라우저에 저장, [피드백 보내기]로 링크(#fb=…)를 만들어 주고받음 */
const TYPES = ['컷 삭제', '길이 조절', '순서 변경', '자막·텍스트 수정', '클립 교체', '기타'];
const COLORS = { '컷 삭제': '#ff5d5d', '길이 조절': '#f5c84b', '순서 변경': '#a77bff', '자막·텍스트 수정': '#4d8dff', '클립 교체': '#2ec5d3', '기타': '#ff7eb6' };
const FPS = [['30000/1001', '29.97'], ['30/1', '30'], ['24000/1001', '23.976'], ['24/1', '24'], ['25/1', '25'], ['60000/1001', '59.94'], ['60/1', '60']];
const DRAW_COLOR = '#ff3b30';
const $ = s => document.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v; else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v === true) el.setAttribute(k, ''); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
};
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 3500 : 2200); }
async function copy(text, ok) { try { await navigator.clipboard.writeText(text); toast(ok || '복사했어요'); return true; } catch (e) { prompt('복사해 주세요', text); return false; } }

/* ---------- 영상 정보 ---------- */
let video = null;          // {id, name, fps}
let items = [];            // 피드백
let rate = { fd: 1001 / 30000, base: 30 };
let selType = null, filter = 'all', activeId = null, viewShapes = null;
const driveIdOf = u => { const m = /\/file\/d\/([A-Za-z0-9_-]{10,})/.exec(u || '') || /[?&]id=([A-Za-z0-9_-]{10,})/.exec(u || '') || /^([A-Za-z0-9_-]{25,})$/.exec((u || '').trim()); return m ? m[1] : null; };
function setRate(f) { const [n, d] = String(f || '30000/1001').split('/').map(Number); const num = n || 30, den = d || 1; rate = { fd: den / num, base: Math.round(num / den) }; }
const pad = n => String(n).padStart(2, '0');
function tcOf(n) { n = Math.max(0, Math.round(n)); const f = n % rate.base, s = Math.floor(n / rate.base); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}:${pad(f)}`; }
function labelOf(n) {   // 플레이어에 보이는 시간(분:초)으로 표시
  const s = Math.round(n * rate.fd), hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (hh ? hh + ':' + pad(m) : m) + ':' + pad(s % 60);
}
function parseTime(str) {   // "1:23"(분:초) · "1:02:03" · "83" · "00:01:23:15"(타임코드) → 프레임
  str = String(str || '').trim(); if (!str) return null;
  const p = str.split(/[:;]/).map(x => x === '' ? NaN : +x);
  if (p.some(isNaN) || p.length > 4) return NaN;
  if (p.length === 4) return (p[0] * 3600 + p[1] * 60 + p[2]) * rate.base + p[3];
  const sec = p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0];
  return Math.floor(sec / rate.fd + 1e-4);
}
const linkFor = v => `${location.origin}${location.pathname}?v=${encodeURIComponent(v.id)}&n=${encodeURIComponent(v.name)}&f=${encodeURIComponent(v.fps)}`;
const keyOf = () => 'fbw:' + video.id;
function saveLocal() { if (video && !store.set(keyOf(), { name: video.name, fps: video.fps, items })) setState('error', '브라우저 저장 공간이 꽉 찼어요'); }
function remember() {
  const r = (store.get('fbw:recent') || []).filter(x => x.id !== video.id);
  r.unshift({ id: video.id, name: video.name, fps: video.fps, at: Date.now() });
  store.set('fbw:recent', r.slice(0, 12));
}

function openVideo(v, opts = {}) {
  video = v; setRate(v.fps);
  const saved = store.get(keyOf());
  items = saved && saved.items ? saved.items : [];
  $('#title').replaceChildren(h('span', { class: 'proj', text: '영상 피드백' }), h('span', { class: 'sep', text: '·' }), h('span', { text: v.name }));
  document.title = v.name + ' · 영상 피드백';
  const stage = $('#stage');
  stage.querySelectorAll('iframe').forEach(f => f.remove());
  $('#stageEmpty').hidden = true;
  stage.prepend(h('iframe', { src: `https://drive.google.com/file/d/${encodeURIComponent(v.id)}/preview`, allow: 'autoplay; fullscreen', allowfullscreen: true }));
  if (!opts.keepUrl) history.replaceState(null, '', linkFor(v));
  remember(); renderAll();
}

/* ---------- 피드백 링크 (보내기·받기) ---------- */
const b64u = {
  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
};
async function pipe(bytes, Stream, mode) { const s = new Blob([bytes]).stream().pipeThrough(new Stream(mode)); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) { try { return 'z' + b64u.enc(await pipe(raw, CompressionStream, 'deflate-raw')); } catch (e) {} }
  return 'j' + b64u.enc(raw);
}
async function unpack(str) {
  const kind = str[0], bytes = b64u.dec(str.slice(1));
  const raw = kind === 'z' ? await pipe(bytes, DecompressionStream, 'deflate-raw') : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function shrinkShapes(shapes) {   // 링크를 짧게: 좌표 0~1000 정수, 펜은 점을 줄임
  return (shapes || []).map(s => {
    let pts = s.points; if (s.tool === 'pen' && pts.length > 120) { const step = Math.ceil(pts.length / 120); pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1); }
    return [['pen', 'arrow', 'rect'].indexOf(s.tool), pts.flatMap(p => [Math.round(p[0] * 1000), Math.round(p[1] * 1000)])];
  });
}
function growShapes(arr) {
  return (arr || []).map(([k, flat]) => { const pts = []; for (let i = 0; i + 1 < flat.length; i += 2) pts.push([flat[i] / 1000, flat[i + 1] / 1000]); return { tool: ['pen', 'arrow', 'rect'][k] || 'pen', color: DRAW_COLOR, points: pts }; })
    .filter(s => s.points.length >= 2);
}
async function makePackage(list) {
  return pack({ v: 1, d: video.id, n: video.name, f: video.fps, a: $('#author').value.trim(),
    i: list.map(it => [it.id, it.start_frame, it.end_frame == null ? -1 : it.end_frame, TYPES.indexOf(it.type), it.memo, it.author || '', shrinkShapes(it.drawing), it.created_at || ''] ) });
}
async function receive(str) {
  const pkg = await unpack(str);
  if (!pkg || pkg.v !== 1 || !pkg.d) throw new Error('피드백 링크가 아니에요');
  const v = { id: pkg.d, name: pkg.n || '영상', fps: pkg.f || '30000/1001' };
  if (!video || video.id !== v.id) openVideo(v, { keepUrl: true });
  const have = new Set(items.map(x => x.id));
  let added = 0;
  for (const [id, sf, ef, ti, memo, author, dr, created] of pkg.i || []) {
    if (have.has(id)) continue;
    items.push({ id, start_frame: sf, end_frame: ef < 0 ? null : ef, type: TYPES[ti] || '기타', memo, author: author || pkg.a || '고객', drawing: growShapes(dr), created_at: created, received: true });
    added++;
  }
  saveLocal(); renderAll();
  history.replaceState(null, '', linkFor(v));

  b.replaceChildren(`📥 ${pkg.a || '고객'} 님이 보낸 피드백 ${(pkg.i || []).length}개` + (added ? ` — 새로 ${added}개를 목록에 넣었어요.` : ' — 이미 목록에 있어요.'),
    h('button', { class: 'btn ghost', text: '닫기', onclick: () => b.hidden = true }));

}

/* ---------- 화면 그리기 ---------- */
const cv = $('#draw'), ctx = cv.getContext('2d');
let drawMode = false, tool = 'pen', inProgress = null, draftShapes = [];
function paintShapes(c, shapes, r) {
  const lw = Math.max(2.5, r.h * 0.006); c.lineCap = 'round'; c.lineJoin = 'round';
  for (const s of shapes) {
    const P = s.points.map(([x, y]) => [r.x + x * r.w, r.y + y * r.h]);
    const path = () => {
      c.beginPath();
      if (s.tool === 'pen') { c.moveTo(...P[0]); P.slice(1).forEach(p => c.lineTo(...p)); }
      else if (s.tool === 'rect') { const [a, b] = P; c.rect(Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])); }
      else { const [a, b] = P, ang = Math.atan2(b[1] - a[1], b[0] - a[0]), hl = Math.max(12, r.h * 0.035);
        c.moveTo(...a); c.lineTo(...b); c.moveTo(b[0] - hl * Math.cos(ang - 0.45), b[1] - hl * Math.sin(ang - 0.45)); c.lineTo(...b); c.lineTo(b[0] - hl * Math.cos(ang + 0.45), b[1] - hl * Math.sin(ang + 0.45)); }
    };
    path(); c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = lw + 3; c.stroke();
    path(); c.strokeStyle = s.color || DRAW_COLOR; c.lineWidth = lw; c.stroke();

}
function drawOverlay() {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hh = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
  const shapes = drawMode ? [...draftShapes, ...(inProgress ? [inProgress] : [])] : (viewShapes || (draftShapes.length ? draftShapes : null));

}
function posOf(e) { const b = cv.getBoundingClientRect(); const c = v => Math.min(1, Math.max(0, v)); return [c((e.clientX - b.left) / b.width), c((e.clientY - b.top) / b.height)]; }
cv.addEventListener('pointerdown', e => { if (!drawMode) return; cv.setPointerCapture(e.pointerId); const p = posOf(e); inProgress = { tool, color: DRAW_COLOR, points: [p, p] }; drawOverlay(); });
cv.addEventListener('pointermove', e => { if (!inProgress) return; const p = posOf(e); if (tool === 'pen') inProgress.points.push(p); else inProgress.points[1] = p; drawOverlay(); });

function enterDraw() { if (!video) return toast('먼저 영상을 불러와 주세요', true); viewShapes = null; activeId = null; drawMode = true; $('#stage').classList.add('drawing'); $('#drawBar').hidden = false; $('#drawBtn').classList.add('on'); drawOverlay(); renderList(); }
function exitDraw() { drawMode = false; inProgress = null; $('#stage').classList.remove('drawing'); $('#drawBar').hidden = true; $('#drawBtn').classList.remove('on'); drawOverlay(); renderHead(); }
$('#drawBtn').onclick = () => drawMode ? exitDraw() : enterDraw();
$('#drawDone').onclick = exitDraw;
$('#undoBtn').onclick = () => { draftShapes.pop(); drawOverlay(); renderHead(); };
$('#clearBtn').onclick = () => { draftShapes = []; drawOverlay(); renderHead(); };
document.querySelectorAll('#drawBar [data-tool]').forEach(b => b.onclick = () => { tool = b.dataset.tool; document.querySelectorAll('#drawBar [data-tool]').forEach(x => x.classList.toggle('on', x === b)); });
new ResizeObserver(drawOverlay).observe($('#stage'));

/* ---------- 피드백 쓰기 ---------- */
const memoEl = $('#memo');
function renderChips() {
  const box = $('#chips'), tl = box.querySelector('.tool');
  box.replaceChildren(...TYPES.map(t => h('span', { class: 'chip' + (selType === t ? ' sel' : ''), style: `--c:${COLORS[t]}`, onclick: () => { selType = selType === t ? null : t; renderChips(); memoEl.focus(); } }, h('i'), t)), tl);
}
function renderHead() {
  const sf = parseTime($('#tStart').value), ef = parseTime($('#tEnd').value);
  let t = (sf != null && !isNaN(sf)) ? labelOf(sf) + (ef != null && !isNaN(ef) && ef > sf ? ' ~ ' + labelOf(ef) : '') + ' 에 남김  (타임코드 ' + tcOf(sf) + ')' : '시간을 적고 피드백을 남겨 주세요';
  if (draftShapes.length) t += `  · ✏️ 그림 ${draftShapes.length}개`;
  $('#head').textContent = t;
}
['#tStart', '#tEnd'].forEach(id => { $(id).addEventListener('input', renderHead); $(id).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); memoEl.focus(); } }); });
function setState(st, msg) {
  const s = $('#state'), now = new Date().toTimeString().slice(0, 8);
  const m = { saved: ['saved', `✓ 저장됨 ${now} (이 브라우저) — 다 남겼으면 📤 피드백 보내기`], error: ['error', '⚠ ' + (msg || '저장하지 못했어요')], draft: ['', '✎ 작성 중'] }[st] || ['', 'Enter로 남기기 · Shift+Enter 줄바꿈 · 남긴 피드백은 이 브라우저에 저장돼요'];
  s.className = 'state ' + m[0]; s.textContent = m[1];
}
memoEl.addEventListener('input', () => setState(memoEl.value ? 'draft' : ''));
memoEl.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); save(); } if (e.key === 'Escape') memoEl.blur(); });
$('#saveBtn').onclick = save;
function save() {
  if (!video) return toast('먼저 영상을 불러와 주세요', true);
  const memo = memoEl.value.trim();
  if (!memo) { toast('내용을 적어 주세요', true); return memoEl.focus(); }
  const sf = parseTime($('#tStart').value), ef = parseTime($('#tEnd').value);
  if (sf == null || isNaN(sf)) { toast('고칠 곳의 시간을 적어 주세요 (예: 1:23)', true); return $('#tStart').focus(); }
  if (isNaN(ef)) { toast('끝 시간 형식을 확인해 주세요 (예: 1:30)', true); return $('#tEnd').focus(); }
  const author = $('#author').value.trim();
  if (!author) { toast('이름을 먼저 적어 주세요 (위쪽)', true); return $('#author').focus(); }
  if (drawMode) exitDraw();
  items.push({ id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), start_frame: sf, end_frame: ef != null && ef > sf ? ef : null,
    type: selType || '기타', memo, author, drawing: draftShapes, created_at: new Date().toISOString() });
  saveLocal();
  memoEl.value = ''; $('#tEnd').value = ''; draftShapes = []; selType = null; renderChips(); renderHead(); drawOverlay(); renderAll(); setState('saved'); memoEl.blur();
}

/* ---------- 목록 ---------- */
function renderFilters() {
  const n = { all: items.length, mine: items.filter(x => !x.received).length, recv: items.filter(x => x.received).length };
  $('#filters').replaceChildren(...[['all', '전체'], ['mine', '내가 남김'], ['recv', '받은 피드백']].map(([k, label]) =>
    h('button', { class: filter === k ? 'on' : '', text: `${label} ${n[k]}`, onclick: () => { filter = k; renderAll(); } })));
  $('#cnt').textContent = items.length ? `전체 ${items.length}` : '';
}
function renderList() {
  const list = $('#list');
  const shown = items.filter(x => filter === 'all' || (filter === 'recv') === !!x.received).sort((a, b) => a.start_frame - b.start_frame || (a.created_at < b.created_at ? -1 : 1));
  if (!video) return list.replaceChildren(h('div', { class: 'empty-list', text: '영상을 불러오면 여기에 피드백이 모여요.' }));
  if (!shown.length) return list.replaceChildren(h('div', { class: 'empty-list', text: '아직 피드백이 없어요.\n플레이어에서 고칠 곳의 시간을 확인하고\n시간·내용을 적어 남겨 주세요.' }));
  list.replaceChildren(...shown.map(it => {
    const el = h('div', { class: 'item' + (activeId === it.id ? ' active' : ''), style: `--c:${COLORS[it.type] || COLORS['기타']}`, onclick: () => {
      if (drawMode) return; activeId = activeId === it.id ? null : it.id; viewShapes = activeId && it.drawing && it.drawing.length ? it.drawing : null;
      if (activeId) toast(`${labelOf(it.start_frame)} — 플레이어에서 이 시간으로 옮겨 확인하세요` + (it.drawing && it.drawing.length ? ' (그림이 화면에 표시돼요)' : ''));
      drawOverlay(); renderList(); } },
      h('div', { class: 'r1' }, h('span', { class: 't', title: '타임코드 ' + tcOf(it.start_frame) + (it.end_frame != null ? ' ~ ' + tcOf(it.end_frame) : ''), text: labelOf(it.start_frame) + (it.end_frame != null ? ' ~ ' + labelOf(it.end_frame) : '') }), h('span', { class: 'ty', text: it.type }),
        it.received ? h('span', { class: 'badge', text: '받음' }) : null),

      h('div', { class: 'meta' }, h('span', { text: '👤 ' + (it.author || '') }), it.drawing && it.drawing.length ? h('span', { text: `✏️ 그림 ${it.drawing.length}` }) : null,
        h('button', { text: '수정', onclick: e => { e.stopPropagation(); const m = prompt('피드백 수정', it.memo); if (m && m.trim()) { it.memo = m.trim(); saveLocal(); renderList(); } } }),
        h('button', { text: '삭제', onclick: e => { e.stopPropagation(); if (confirm('이 피드백을 지울까요?')) { items = items.filter(x => x !== it); if (activeId === it.id) { activeId = null; viewShapes = null; drawOverlay(); } saveLocal(); renderAll(); } } })));

}
function renderAll() { renderFilters(); renderList(); }

/* ---------- 창 ---------- */
function openModal(...kids) { $('#mbox').replaceChildren(...kids); $('#modal').hidden = false; const f = $('#mbox').querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 0); }
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
const msgEl = () => h('div', { class: 'msg' });
const say = (el, t, k) => { el.className = 'msg ' + (k || ''); el.textContent = t; };

function addDialog() {
  const url = h('input', { placeholder: 'https://drive.google.com/file/d/…/view' });
  const name = h('input', { placeholder: '예: intro_v2 (타임라인 FCPXML과 같은 이름이면 맥 도구에서 자동으로 짝지어져요)' });
  const fps = h('select', {}, ...FPS.map(([v, l]) => h('option', { value: v, text: l })));
  const msg = msgEl();
  const go = () => {
    const id = driveIdOf(url.value);
    if (!id) return say(msg, '구글 드라이브 공유 링크가 아니에요 (예: https://drive.google.com/file/d/…/view)', 'err');
    const n = name.value.trim().replace(/\.(mp4|mov|m4v|webm)$/i, '');
    if (!n) return say(msg, '영상 이름을 적어 주세요', 'err');
    closeModal(); openVideo({ id, name: n, fps: fps.value }); $('#banner').hidden = true; toast('불러왔어요 — 🔗 고객 링크로 고객에게 보내세요');
  };
  [url, name].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); }));
  const recent = store.get('fbw:recent') || [];
  openModal(h('h3', { text: '구글 드라이브 영상 불러오기' }),
    h('p', { text: '드라이브에서 영상 공유를 "링크가 있는 모든 사용자"로 바꾼 뒤 링크를 복사해 넣어 주세요. 영상 파일은 내려받지 않고 드라이브 플레이어로 바로 재생해요.' }),
    h('label', {}, '공유 링크', url), h('label', {}, '영상 이름', name), h('label', {}, '프레임레이트', fps), msg,
    recent.length ? h('div', { class: 'recent' }, h('p', { text: '최근 영상' }), ...recent.map(r => h('a', { href: linkFor(r) }, r.name, h('span', { text: new Date(r.at).toLocaleDateString() })))) : null,
    h('div', { class: 'mrow' }, h('button', { class: 'btn ghost', text: '취소', onclick: closeModal }), h('button', { class: 'btn primary', text: '불러오기', onclick: go })));
}
$('#addBtn').onclick = addDialog;
$('#shareBtn').onclick = () => {
  if (!video) return toast('먼저 영상을 불러와 주세요', true);
  const u = linkFor(video);
  openModal(h('h3', { text: '고객 링크 — ' + video.name }),
    h('p', { text: '고객은 이 링크로 영상을 보며 피드백을 남기고, 다 남긴 뒤 [📤 피드백 보내기]로 만든 링크를 보내 줘요. 그 링크를 여기서 [📥 받은 피드백 링크 열기]로 열면 고객이 표시한 내용(시간·메모·그림)이 그대로 보여요.' }),
    h('div', { class: 'linkbox', text: u }),
    h('div', { class: 'mrow' }, h('button', { class: 'btn ghost', text: '닫기', onclick: closeModal }), h('button', { class: 'btn primary', text: '링크 복사', onclick: () => copy(u, '고객 링크를 복사했어요') })));
};
$('#sendBtn').onclick = async () => {
  if (!video) return toast('먼저 영상을 불러와 주세요', true);
  const mine = items.filter(x => !x.received);
  if (!mine.length) return toast('보낼 피드백이 없어요. 먼저 피드백을 남겨 주세요', true);
  const data = await makePackage(mine);
  const u = `${location.origin}${location.pathname}#fb=${data}`;
  const share = navigator.share ? h('button', { class: 'btn', text: '공유…', onclick: () => navigator.share({ title: video.name + ' 피드백', url: u }).catch(() => {}) }) : null;
  openModal(h('h3', { text: `📤 피드백 보내기 — ${mine.length}개` }),
    h('p', { text: '아래 링크를 복사해서 편집자에게 카톡·문자·메일로 보내 주세요. 링크 안에 남긴 시간·메모·그림이 모두 들어 있어요 (서버에 저장되지 않아요).' }),
    h('div', { class: 'linkbox', text: u }),
    u.length > 8000 ? h('p', { style: 'color:#f5d28a', text: '링크가 길어요. 카톡에서 잘리면 그림을 조금 줄이거나 나눠서 보내 주세요.' }) : null,
    h('div', { class: 'mrow' }, h('button', { class: 'btn ghost', text: '닫기', onclick: closeModal }), share, h('button', { class: 'btn primary', text: '링크 복사', onclick: () => copy(u, '피드백 링크를 복사했어요 — 편집자에게 보내 주세요') })));
};
$('#recvBtn').onclick = () => {
  const ta = h('textarea', { rows: 4, placeholder: '고객이 보낸 피드백 링크(…#fb=…)를 붙여넣으세요' }), msg = msgEl();
  const go = async () => {
    const m = /#fb=([A-Za-z0-9_-]+)/.exec(ta.value.trim()) || /^([zj][A-Za-z0-9_-]+)$/.exec(ta.value.trim());
    if (!m) return say(msg, '피드백 링크가 아니에요 (주소에 #fb= 가 있어야 해요)', 'err');
    try { await receive(m[1]); closeModal(); } catch (e) { say(msg, '읽지 못했어요 — 링크가 잘렸는지 확인해 주세요 (' + e.message + ')', 'err'); }
  };
  openModal(h('h3', { text: '📥 받은 피드백 링크 열기' }), h('p', { text: '고객이 보낸 링크를 그냥 클릭해서 열어도 돼요. 여러 명이 보냈으면 하나씩 열면 목록에 모두 모여요.' }), ta, msg,
    h('div', { class: 'mrow' }, h('button', { class: 'btn ghost', text: '닫기', onclick: closeModal }), h('button', { class: 'btn primary', text: '열기', onclick: go })));
};

/* ---------- 단축키 ---------- */
window.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'KeyD') { e.preventDefault(); drawMode ? exitDraw() : enterDraw(); }
  else if (e.code === 'Escape' && drawMode) { e.preventDefault(); exitDraw(); }
  else if (e.code === 'KeyT') { e.preventDefault(); $('#tStart').focus(); }
  else if (e.code === 'KeyM' || e.code === 'KeyC') { e.preventDefault(); memoEl.focus(); }
});

window.addEventListener('hashchange', () => { const m = /#fb=([A-Za-z0-9_-]+)/.exec(location.hash); if (m) receive(m[1]).catch(() => toast('피드백 링크를 읽지 못했어요', true)); });

/* ---------- 시작 ---------- */
(async function start() {
  $('#author').value = store.get('fbw:author') || '';
  $('#author').addEventListener('input', () => store.set('fbw:author', $('#author').value.trim()));
  renderChips(); renderHead(); renderAll();
  const q = new URLSearchParams(location.search);
  if (q.get('p')) { location.replace('sheet.html' + location.search); return; }   // 예전(구글 시트) 고객 링크
  const fb = /#fb=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (fb) { try { await receive(fb[1]); } catch (e) { toast('피드백 링크를 읽지 못했어요 — 링크가 잘렸는지 확인해 주세요', true); } return; }
  const id = q.get('v');
  if (id && /^[A-Za-z0-9_-]{10,}$/.test(id)) {
    openVideo({ id, name: (q.get('n') || '영상').slice(0, 80), fps: FPS.some(f => f[0] === q.get('f')) ? q.get('f') : '30000/1001' }, { keepUrl: true });
    const b = $('#banner'); b.className = 'banner info'; b.hidden = false;
    b.replaceChildren('▶ 영상을 재생하다 고칠 곳에서 멈추고, 플레이어 아래 시간을 "시간" 칸에 적어 피드백을 남겨 주세요. 화면에 그려서 표시할 수도 있어요 (D). 다 남겼으면 오른쪽 📤 피드백 보내기!',
      h('button', { class: 'btn ghost', text: '닫기', onclick: () => b.hidden = true }));
  } else addDialog();
})();
</script>
